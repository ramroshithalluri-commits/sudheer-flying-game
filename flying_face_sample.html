function gameOverSound(){
if(!playing)return;
playing=false;
const voice=document.getElementById('voice');voice.pause();
const endingSound=document.getElementById('endingSound');
endingSound.currentTime=0;
endingSound.play().catch(()=>{});
}
function reset(){y=330;vy=0;pipes=[];score=0;frame=0;playing=true;
const endingSound=document.getElementById('endingSound');endingSound.pause();endingSound.currentTime=0;
const startSound=document.getElementById('startSound');startSound.pause();startSound.currentTime=0;startSound.play().catch(()=>{});
const voice=document.getElementById('voice');voice.play().catch(()=>{});
}
function flap(){
if(!playing)reset();
vy=-7.5;

}
document.getElementById('start').onclick=()=>{started=true;reset();};
c.addEventListener('pointerdown',()=>{if(!started){started=true;reset();}else flap();});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!started){started=true;reset();}else flap();}});
function draw(){ctx.clearRect(0,0,430,720);
if(!playing){const voice=document.getElementById('voice');voice.pause();}
if(!started){
ctx.fillStyle='#090909';ctx.fillRect(0,0,430,720);
if(startPhoto.complete&&startPhoto.naturalWidth){let scale=Math.min(430/startPhoto.width,620/startPhoto.height);let w=startPhoto.width*scale,h=startPhoto.height*scale;ctx.drawImage(startPhoto,(430-w)/2,30,w,h);}
ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,620,430,100);
ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillText('FLYING FACE',215,665);
ctx.font='18px system-ui';ctx.fillText('TAP START TO PLAY',215,695);
requestAnimationFrame(draw);return;
}
let sky=ctx.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#102033');sky.addColorStop(.55,'#18334a');sky.addColorStop(1,'#263f52');ctx.fillStyle=sky;ctx.fillRect(0,0,430,720);
// muted atmospheric glows and stars
[[80,170],[280,230],[145,370],[350,420],[65,510]].forEach(([x,yy])=>{ctx.fillStyle='rgba(125,170,205,.045)';ctx.beginPath();ctx.ellipse(x,yy,75,22,0,0,Math.PI*2);ctx.fill();});
for(let i=0;i<28;i++){ctx.fillStyle='rgba(220,230,245,.23)';ctx.fillRect((i*83+31)%430,(i*137+42)%610,1.5,1.5);}

if(playing){frame++;vy+=.32;y+=vy;if(frame%105===0)pipes.push({x:450,gapY:180+Math.random()*340,passed:false});
pipes.forEach(p=>p.x-=2.7);pipes=pipes.filter(p=>p.x>-75);
pipes.forEach(p=>{if(!p.passed&&p.x<75){p.passed=true;score++;}if(70+36>p.x&&70-36<p.x+65&&(y-30<p.gapY-105||y+30>p.gapY+105))gameOverSound();});
if(y<0||y>675)gameOverSound();}
pipes.forEach(p=>{
ctx.save();ctx.shadowColor='#ff4f9a';ctx.shadowBlur=14;
ctx.fillStyle='#f04491';ctx.strokeStyle='#ff9bc7';ctx.lineWidth=3;
ctx.fillRect(p.x,0,65,p.gapY-105);ctx.strokeRect(p.x,0,65,p.gapY-105);
ctx.fillRect(p.x,p.gapY+105,65,720);ctx.strokeRect(p.x,p.gapY+105,65,720);
ctx.shadowBlur=0;ctx.fillStyle='#ff9bc7';ctx.fillRect(p.x+9,0,10,p.gapY-105);ctx.fillRect(p.x+9,p.gapY+105,10,615);
ctx.fillStyle='#d82d79';ctx.fillRect(p.x-5,p.gapY-119,75,14);ctx.fillRect(p.x-5,p.gapY+105,75,14);
ctx.restore();});
// silhouetted city skyline at the bottom edge
ctx.fillStyle='#12283a';
[[0,560,34,120],[28,595,28,85],[58,570,40,110],[96,615,24,65],[122,585,36,95],[158,620,25,60],[185,600,44,80],[230,625,30,55],[260,590,34,90],[294,615,25,65],[320,575,42,105],[362,610,28,70],[390,585,40,95]].forEach(([x,yy,w,h])=>ctx.fillRect(x,yy,w,h));
ctx.fillStyle='#0d1b2a';ctx.fillRect(0,680,430,40);ctx.strokeStyle='#7d6b47';ctx.lineWidth=2;
for(let x=15;x<430;x+=70){ctx.beginPath();ctx.moveTo(x,700);ctx.lineTo(x+25,700);ctx.stroke();}
ctx.fillStyle='#52647a';ctx.font='bold 8px system-ui';ctx.textAlign='center';ctx.fillText('FLYING FACE',215,718);
if(img.complete){ctx.save();ctx.translate(70,y);ctx.rotate(Math.max(-.35,Math.min(.5,vy*.04)));
const wingSwing=Math.sin(frame*0.32)*12;
ctx.lineWidth=4;ctx.strokeStyle='#263244';ctx.fillStyle='#fff7e8';
function wing(side){ctx.save();ctx.scale(side,1);ctx.rotate(wingSwing*Math.PI/180);
ctx.beginPath();ctx.moveTo(-20,0);ctx.quadraticCurveTo(-58,-42,-76,-18);
ctx.quadraticCurveTo(-66,0,-76,12);ctx.quadraticCurveTo(-48,27,-20,10);ctx.closePath();ctx.fill();ctx.stroke();
ctx.beginPath();ctx.moveTo(-28,1);ctx.quadraticCurveTo(-52,-16,-65,-13);
ctx.moveTo(-30,7);ctx.quadraticCurveTo(-48,12,-62,7);ctx.stroke();ctx.restore();}
wing(-1);wing(1);
ctx.drawImage(img,-34,-34,68,68);ctx.restore();}
ctx.fillStyle='#fff';ctx.font='bold 36px system-ui';ctx.textAlign='center';ctx.fillText(score,215,55);
if(!playing){
if(frame>0&&lostPhoto.complete&&lostPhoto.naturalWidth){
ctx.fillStyle='#000';ctx.fillRect(0,0,430,720);
let scale=Math.min(430/lostPhoto.width,720/lostPhoto.height);
let w=lostPhoto.width*scale,h=lostPhoto.height*scale;
ctx.drawImage(lostPhoto,(430-w)/2,(720-h)/2,w,h);
ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(35,630,360,65);
ctx.fillStyle='white';ctx.font='bold 24px system-ui';ctx.textAlign='center';
ctx.fillText('TAP / SPACE TO RETRY',215,670);
}else{ctx.fillStyle='rgba(8,15,30,.68)';ctx.fillRect(25,270,380,150);ctx.fillStyle='white';ctx.font='bold 30px system-ui';ctx.fillText('TAP START',215,325);ctx.font='20px system-ui';ctx.fillText('Tap / SPACE to play',215,365);}
}
requestAnimationFrame(draw);}
draw();
